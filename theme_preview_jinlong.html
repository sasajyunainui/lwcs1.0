<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>金龙王 - 内敛深渊与高压白炽 概念版</title>
  <style>
    :root {
      /* 纯粹的物理高温色谱 */
      --heat-core: #ffffff;    /* 白炽点 */
      --heat-high: #ffcc00;    /* 亮黄 */
      --heat-mid: #ff3300;     /* 亮橙 */
      --heat-low: #8a1200;     /* 暗红 */
      --abyss-black: #050101;  /* 深渊黑 */
      --card-bg: #0a0302;      /* 面板底板 */
      
      --text-main: #fff8df;
      --text-muted: #8a3a3a;
    }

    body {
      background: var(--abyss-black);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    .container {
      display: flex;
      gap: 20px;
      width: 900px;
      height: 500px;
    }

    /* 极简的高级感面板，没有任何多余的杂光 */
    .card {
      background: var(--card-bg);
      border: 1px solid #2a0a05; /* 极细的暗红边线 */
      box-shadow: 
        inset 0 0 20px rgba(0,0,0,0.8), /* 内侧压暗 */
        0 10px 30px rgba(0,0,0,0.9);
      padding: 30px;
      flex: 1;
      position: relative;
    }

    .left-panel { flex: 1; }
    .right-panel { flex: 1.5; }

    .panel-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 40px;
      letter-spacing: 4px;
    }

    /* =========================================
       状态条：从死黑到白炽的高压渐变
       ========================================= */
    .vital-row { margin-bottom: 30px; }
    
    .vital-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .vital-label span {
      color: var(--text-main);
      font-family: "Consolas", monospace;
    }

    /* 深槽：极简的黑框，表现金属内部的挖空 */
    .vital-track {
      height: 6px;
      background: #000;
      box-shadow: inset 0 1px 3px rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.03);
      position: relative;
    }

    /* 填充：真正的物理加热变色 */
    .vital-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, 
        #000000 0%, 
        var(--heat-low) 40%, 
        var(--heat-mid) 75%, 
        var(--heat-high) 95%, 
        var(--heat-core) 100%
      );
      box-shadow: 0 0 8px rgba(255, 51, 0, 0.4);
      position: relative;
    }

    /* 尽头的白炽火花，极高频的微闪，带来随时会过载的危险感 */
    .vital-fill::after {
      content: "";
      position: absolute;
      right: 0; top: -1px; bottom: -1px; width: 4px;
      background: var(--heat-core);
      box-shadow: 0 0 10px var(--heat-core);
      animation: flicker 0.05s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* =========================================
       武魂舞台：锐利的点阵光带与中心黑洞
       ========================================= */
    .spirit-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .spirit-title {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 6px;
    }
    .spirit-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .spirit-stage {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 底层黑洞：吞噬一切，只在中心留有微弱的闷烧红光 */
    .black-hole {
      position: absolute;
      inset: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #2a0500 0%, #000 60%);
      box-shadow: inset 0 0 20px #000;
      animation: deep-pulse 4s ease-in-out infinite alternate;
    }

    /* 外层锐利光环：取消廉价发光，只留 1px 的锋利线条，高速旋转 */
    .sharp-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed var(--heat-mid);
      transform: rotateX(65deg);
      animation: spin-fast 1.5s linear infinite;
    }

    /* 内层锐利点阵 */
    .sharp-ring-inner {
      position: absolute;
      inset: 30px;
      border-radius: 50%;
      border: 2px dotted var(--heat-high);
      transform: rotateX(65deg);
      animation: spin-fast-rev 1s linear infinite;
    }

    /* 核心超高速内环 */
    .sharp-ring-core {
      position: absolute;
      inset: 70px;
      border-radius: 50%;
      border: 1px solid var(--heat-core);
      box-shadow: 0 0 10px var(--heat-core), inset 0 0 10px var(--heat-core);
      transform: rotateX(65deg);
      animation: spin-fast 0.5s linear infinite;
      opacity: 0.8;
    }

    @keyframes deep-pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.05); opacity: 1; box-shadow: inset 0 0 15px #3a0b02; }
    }
    @keyframes spin-fast {
      100% { transform: rotateX(65deg) rotateZ(360deg); }
    }
    @keyframes spin-fast-rev {
      100% { transform: rotateX(65deg) rotateZ(-360deg); }
    }

  </style>
</head>
<body>

  <div class="container">
    <!-- 左侧：体征/属性 -->
    <div class="card left-panel">
      <div class="panel-title">体 征</div>
      
      <div class="vital-row">
        <div class="vital-label">生命 <span>710 / 710</span></div>
        <div class="vital-track"><div class="vital-fill"></div></div>
      </div>
      
      <div class="vital-row">
        <div class="vital-label">魂力 <span>2,525 / 2,525</span></div>
        <div class="vital-track"><div class="vital-fill"></div></div>
      </div>

      <div class="vital-row">
        <div class="vital-label">体力 <span>710 / 710</span></div>
        <div class="vital-track"><div class="vital-fill"></div></div>
      </div>

      <div class="vital-row">
        <div class="vital-label">精神 <span>45 / 45</span></div>
        <div class="vital-track"><div class="vital-fill"></div></div>
      </div>
    </div>

    <!-- 右侧：武魂舞台 -->
    <div class="card right-panel">
      <div class="spirit-header">
        <div class="spirit-title">五行麒麟</div>
        <div class="spirit-subtitle">强攻系</div>
      </div>

      <div class="spirit-stage">
        <!-- 中心的闷烧深渊 -->
        <div class="black-hole"></div>
        <!-- 锐利、高速的旋转光环 -->
        <div class="sharp-ring-outer"></div>
        <div class="sharp-ring-inner"></div>
        <div class="sharp-ring-core"></div>
      </div>
    </div>
  </div>

</body>
</html>
